{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="auth-sub">Join DemoShop today &mdash; it&apos;s free</p>

    <form action="/register" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf }}" />

      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password <span style="font-weight:400;color:var(--color-text-muted);">(min 8 characters)</span></label>
        <input id="password" name="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="new-password" minlength="8" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="padding:13px;font-size:16px;margin-top:4px;">
        Create Account
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
