{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to your DemoShop account</p>

    <form action="/login" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf }}" />

      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="padding:13px;font-size:16px;margin-top:4px;">
        Sign In
      </button>
    </form>

    <div class="demo-hint">
      <strong>Demo credentials:</strong><br />
      user@demo.local &nbsp;/&nbsp; User123!<br />
      admin@demo.local &nbsp;/&nbsp; Admin123!
    </div>

    <p class="auth-footer">
      Don&apos;t have an account? <a href="/register">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
